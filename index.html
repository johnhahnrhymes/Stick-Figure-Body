:root{--bg:#fff;--fg:#000;--mut:#666;--line:#000;--card:#f2f2f2}
html.dark{--bg:#000;--fg:#fff;--mut:#aaa;--line:#fff;--card:#1c1c1c}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:"Comic Sans MS","Comic Sans","SFB Comic","Comic Neue",sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:16px}
h1{font-size:44px;text-align:center;margin:8vh 0 6vh;line-height:1.1}
h2{text-align:center;margin:8px 0 16px}
button{font:inherit;font-weight:700;color:var(--fg);background:var(--bg);border:3px solid var(--line);border-radius:14px;padding:14px 20px;font-size:22px;cursor:pointer}
button:active{transform:scale(.97)}
.menu{display:flex;flex-direction:column;gap:18px;align-items:stretch}
.back{align-self:flex-start;font-size:18px;padding:6px 12px;margin-bottom:6px}
.picker{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:2vh}
.row{display:flex;align-items:center;gap:14px;justify-content:center}
.arrow{width:64px;height:64px;padding:0;font-size:28px}
.big{font-size:84px;line-height:1}
.theme{font-size:34px}
.scheme{font-size:28px;min-width:190px;text-align:center}
.info{color:var(--mut);font-size:17px;text-align:center}
.bar{position:sticky;top:0;background:var(--bg);border-bottom:3px solid var(--line);text-align:center;font-size:34px;padding:8px;margin:-16px -16px 10px;font-variant-numeric:tabular-nums}
.bar small{display:block;font-size:14px;color:var(--mut)}
.title{text-align:center;font-size:24px;margin:6px 0}
.pic{width:100%;aspect-ratio:680/310;display:flex;align-items:center;justify-content:center}
.pic svg{width:100%;height:100%}
.rest{font-size:96px;font-variant-numeric:tabular-nums}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding-top:12px}
.count{text-align:center;font-size:26px}
.foot button{font-size:26px}
.card{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:19px}
.card .m{display:flex;justify-content:space-between;gap:10px;font-size:16px;padding:2px 0}
.ohyeah{font-size:64px;text-align:center;margin:4vh 0 10px}
.tabs{display:flex;gap:10px;margin-bottom:12px}.tabs button{flex:1;font-size:18px;padding:8px}
.tabs button.on{background:var(--fg);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tr{position:relative;text-align:center;font-size:13px}.tr canvas{width:100%;height:auto;display:block;border-radius:8px;background:#fff}
.tr.lock canvas{opacity:.12;filter:grayscale(1)}
.tr.lock::after{content:'🔒';position:absolute;top:34%;left:0;right:0;font-size:26px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.ov canvas{max-width:100%;max-height:90vh;background:#fff;border-radius:12px}
.center{text-align:center;font-size:24px;margin:6px 0}

  let rows=localLog.slice();
  if(db&&uid){try{const q=await db.collection('data/users/'+uid+'/workouts').get();
    const m=new Map(rows.map(r=>[r.id,r]));q.docs.forEach(d=>m.set(d.id,d.data()));rows=[...m.values()]}catch(e){}}
  return rows.sort((a,b)=>(b.completedAt||0)-(a.completedAt||0));
}

/* ---------- screens ---------- */
let scr='home';
function render(){stopTickIfIdle();({home,pick,work,done,glaze})[scr]()}
function stopTickIfIdle(){if(scr!=='work')stopTick()}
function go(s){scr=s;render()}

function home(){
  $app.innerHTML=`<h1>Stick Figure Body</h1><div class="menu">
  <button id="b1">Work out</button><button id="b2">Glaze Me</button>
  <button id="b3">${st.dark?'Light Mode':'Dark Mode'}</button></div>
  ${/^https?:/.test(location.protocol)?'<p class="info" style="margin-top:28px"><a href="Stick_Figure_Body.txt" download="Stick_Figure_Body.txt" style="color:inherit">Download a copy of the app (.txt)</a><br>Rename it to .html to run it from a file.</p>':''}`;
  b1.onclick=()=>go('pick');b2.onclick=()=>go('glaze');
  b3.onclick=()=>{st.dark=!st.dark;document.documentElement.classList.toggle('dark',st.dark);saveProfile();render()};
}
function pick(){
  const sc=SCHEMES[st.scheme];
  $app.innerHTML=`<button class="back" id="bk">← Back</button><h2>Work out</h2><div class="picker">
  <button class="arrow" id="up">▲</button>
  <div class="center" style="margin:0">Day</div><div class="big">${st.day}</div>
  <div class="theme">${themeOf(st.day)}</div>
  <button class="arrow" id="dn">▼</button>
  <div class="row"><button class="arrow" id="lf">◀</button><div class="scheme">${sc.name}</div><button class="arrow" id="rt">▶</button></div>
  <div class="info">${sc.pct}% 1RM · ${sc.sets} sets × ${sc.reps} reps · ${sc.rest>=60?(sc.rest/60)+' min':sc.rest+' s'} rest</div>
  <button id="go" style="margin-top:10px;width:70%">Confirm</button></div>`;
  bk.onclick=()=>go('home');
  up.onclick=()=>{st.day=st.day>=48?1:st.day+1;saveProfile();pick()};
  dn.onclick=()=>{st.day=st.day<=1?48:st.day-1;saveProfile();pick()};
  lf.onclick=()=>{st.scheme=(st.scheme+2)%3;saveProfile();pick()};
  rt.onclick=()=>{st.scheme=(st.scheme+1)%3;saveProfile();pick()};
  document.getElementById('go').onclick=startWorkout;
}
function startWorkout(){
  saveProfile();
  const sc=SCHEMES[st.scheme];
  w={day:st.day,theme:themeOf(st.day),scheme:sc,moves:PLAN[st.day-1],mi:0,sets:sc.sets,resting:false,restLeft:0,
     elapsed:0,last:Date.now(),log:PLAN[st.day-1].map(n=>({name:n,sets:0,reps:sc.reps}))};
  scr='work';render();
  stopTick();tick=setInterval(onTick,250);
}
function onTick(){
  const now=Date.now(),dt=(now-w.last)/1000;w.last=now;
  if(w.resting){w.restLeft=Math.max(0,w.restLeft-dt);const r=document.getElementById('rest');if(r)r.textContent=Math.ceil(w.restLeft)}
  else{w.elapsed+=dt}
  const t=document.getElementById('clock');if(t)t.textContent=fmt(w.elapsed);
}
function work(){
  const sc=w.scheme,lastSet=w.sets===1,lastMove=w.mi===w.moves.length-1;
  // after pressing rest on the last set of a movement, sets=0 and we show up-next
  const showMi=(w.resting&&w.sets===0)?Math.min(w.mi+1,w.moves.length-1):w.mi;
  const name=w.moves[showMi];
  let mid,btn;
  if(w.resting){
    mid=`<div class="pic"><div class="rest" id="rest">${Math.ceil(w.restLeft)}</div></div>`;
    btn=`<button id="act">Workout</button>`;
  }else{
    mid=`<div class="pic">${IMGS[name][st.dark?'d':'l']}</div>`;
    btn=(lastSet&&lastMove)?`<button id="act">Finish</button>`:`<button id="act">Rest</button>`;
  }
  const shownSets=w.resting&&w.sets===0?sc.sets:w.sets;
  $app.innerHTML=`<div class="bar"><span id="clock">${fmt(w.elapsed)}</span><small>Day ${w.day} · ${w.theme} · ${sc.name}${w.resting?' · paused':''}</small></div>
  <div class="title">${w.resting&&w.sets===0?'Up next: ':''}${esc(name)}</div>${mid}
  <div class="foot"><div class="count">Sets ${shownSets} · Reps ${sc.reps}</div>${btn}</div>`;
  document.getElementById('act').onclick=onAct;
}
function onAct(){
  const sc=w.scheme;
  if(!w.resting){
    w.log[w.mi].sets++;
    if(w.sets===1&&w.mi===w.moves.length-1){return finish()}
    w.sets--;w.resting=true;w.restLeft=sc.rest;w.last=Date.now();work();
  }else{
    w.resting=false;w.last=Date.now();
    if(w.sets===0){w.mi++;w.sets=sc.sets}
    work();
  }
}
async function finish(){
  stopTick();
  const rec={id:'w'+Date.now().toString(36),day:w.day,theme:w.theme,scheme:w.scheme.name,
    pct1RM:w.scheme.pct,durationSec:Math.round(w.elapsed),completedAt:Date.now(),
    movements:w.log.map(m=>({name:m.name,sets:m.sets,reps:m.reps}))};
  w.rec=rec;
  st.day=Math.min(48,w.day+1);setStore();saveProfile();
  scr='done';render();
  await saveWorkout(rec);
}
function done(){
  const r=w.rec;
  $app.innerHTML=`<div class="ohyeah">Oh Yeah!</div>
  <div class="center">(Day ${r.day}, ${r.theme}, ${r.scheme})</div>
  <div class="center">Time: ${fmt(r.durationSec)}</div>
  <div style="width:75%;margin:8px auto"><canvas id="tc" style="width:100%;border-radius:10px;background:#fff"></canvas></div>
  <div class="foot"><button id="h">Home</button></div>`;
  if(trophyReady)drawTrophy(document.getElementById('tc'),r.day,r.scheme);else trophyImg.addEventListener('load',()=>{const c=document.getElementById('tc');if(c)drawTrophy(c,r.day,r.scheme)});
  h.onclick=()=>{w=null;go('home')};
}
async function exportApp(){
  const rows=await loadLog();
  const data={day:st.day,scheme:st.scheme,dark:st.dark,log:rows};
  const html=SRC.replace(/(<script id="sfb-save" type="application\/json">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+JSON.stringify(data).replace(/</g,'\\u003c')+b);
  const url=URL.createObjectURL(new Blob([html],{type:'text/html'}));
  const a=document.createElement('a');a.href=url;a.download='Stick_Figure_Body.html';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
}
let gview='trophies',gscheme=0,gtimes=null;
const trophyImg=new Image();let trophyReady=false;trophyImg.onload=()=>{trophyReady=true;if(scr==='glaze')drawTrophies()};trophyImg.src=TROPHY_SRC;
function drawTrophy(cv,day,scheme){
  const c=cv.getContext('2d');cv.width=1000;cv.height=1000;c.drawImage(trophyImg,0,0,1000,1000);
  c.textAlign='center';c.textBaseline='middle';c.fillStyle='#000';c.strokeStyle='#fff';c.lineJoin='round';
  const ff='"DejaVu Serif","Georgia","Times New Roman",serif';
  const dt='DAY '+day,th=themeOf(day).toUpperCase();
  c.lineWidth=18;c.font='bold 80px '+ff;c.strokeText(dt,495,240);c.fillText(dt,495,240);
  c.lineWidth=16;c.font='bold 62px '+ff;c.strokeText(th,495,325);c.fillText(th,495,325);
  const sn=scheme.toUpperCase();c.font='bold 44px '+ff;
  const w0=c.measureText(sn).width,sx=w0>215?215/w0:1;
  c.save();c.translate(500,877);c.scale(sx,1);c.fillText(sn,0,0);c.restore();
}
function drawTrophies(){
  const g=document.getElementById('grid');if(!g||!trophyReady)return;
  g.querySelectorAll('canvas').forEach(cv=>drawTrophy(cv,+cv.dataset.d,SCHEMES[gscheme].name));
}
async function glaze(){
  $app.innerHTML=`<button class="back" id="bk">← Back</button><h2>Glaze Me</h2>
  <div class="tabs"><button id="tt" class="${gview==='trophies'?'on':''}">Trophies</button><button id="th" class="${gview==='history'?'on':''}">History</button></div>
  <button id="sv" style="width:100%;font-size:16px;padding:8px;margin-bottom:12px">Save my progress into the app file</button>
  <div id="list" class="info">Loading…</div>`;
  sv.onclick=exportApp;
  bk.onclick=()=>go('home');
  tt.onclick=()=>{gview='trophies';glaze()};th.onclick=()=>{gview='history';glaze()};
  const rows=await loadLog();
  if(scr!=='glaze')return;
  const L=document.getElementById('list');
  if(gview==='trophies'){
    const got=new Set(rows.map(r=>r.day+'|'+r.scheme));
    const total=got.size;
    L.className='';
    L.innerHTML=`<div class="tabs">${SCHEMES.map((s,i)=>`<button data-i="${i}" class="${i===gscheme?'on':''}" style="font-size:14px">${s.name}</button>`).join('')}</div>
     <div class="center" style="font-size:18px">${total} / 144 trophies</div><div class="grid" id="grid"></div>`;
    const g=document.getElementById('grid');
    for(let d=1;d<=48;d++){
      const earned=got.has(d+'|'+SCHEMES[gscheme].name);
      const el=document.createElement('div');el.className='tr'+(earned?'':' lock');
      el.innerHTML=`<canvas data-d="${d}"></canvas>`;
      if(earned)el.onclick=()=>{const ov=document.createElement('div');ov.className='ov';const cv=document.createElement('canvas');
        drawTrophy(cv,d,SCHEMES[gscheme].name);ov.appendChild(cv);ov.onclick=()=>ov.remove();document.body.appendChild(ov)};
      g.appendChild(el);
    }
    L.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{gscheme=+b.dataset.i;glaze()});
    drawTrophies();
    return;
  }
  if(!rows.length){L.textContent='No workouts yet. Go work out!';return}
  L.className='';
  L.innerHTML=rows.map(r=>`<div class="card"><h3>Day ${r.day} · ${esc(r.theme)} · ${esc(r.scheme)}</h3>
   <div class="info" style="text-align:left;margin-bottom:6px">${new Date(r.completedAt).toLocaleDateString()} · ${fmt(r.durationSec)}</div>
   ${r.movements.map(m=>`<div class="m"><span>${esc(m.name)}</span><span>${m.sets} sets × ${m.reps} reps</span></div>`).join('')}</div>`).join('');
}
render();
initDb();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}}
</script></body></html>
